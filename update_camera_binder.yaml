---
- name: Configure Camera Binder update
  hosts: zplayers
  become: yes
  serial: 100%
  tasks:
    - name: Clean up old files and configurations
      block:
        - name: Remove old UUID files
          file:
            path: "{{ item }}"
            state: absent
          with_items:
            - /etc/camera_binding/livedooh_camera_uuid.txt
            - /etc/camera_binding/vidireports_camera_uuid.txt

        - name: Remove old symlinks
          file:
            path: "{{ item }}"
            state: absent
          with_items:
            - /dev/camera_livedooh
            - /dev/camera_vidireports
            - /dev/camera_4k
            - /dev/camera_1080p

        - name: Reset video device permissions
          shell: |
            chmod 660 /dev/video* || true
            chown root:video /dev/video* || true

    - name: Copy configuration files 12
      block:
        - name: Copy camera_binder.service
          copy:
            src: /home/zignage/camerapub/camera_binder.service
            dest: /etc/systemd/system/camera_binder.service
            mode: '0644'
            force: yes
        - name: Copy vidireports.service
          copy:
            src: /home/zignage/camerapub/vidireports.service
            dest: /etc/systemd/system/vidireports.service
            mode: '0644'
            force: yes

        - name: Copy camera_binder.py
          copy:
            src: /home/zignage/camerapub/camera_binder.py
            dest: /home/zignage/camera_binder/camera_binder.py
            force: yes

        - name: Copy camera_config.json
          copy:
            src: /home/zignage/camerapub/camera_config.json
            dest: /etc/camera_binding/camera_config.json
            mode: '0644'
            force: yes

        - name: Copy udev rules
          copy:
            src: /home/zignage/camerapub/camera-permissions.rules
            dest: /etc/udev/rules.d/99-camera-permissions.rules
            mode: '0644'
            force: yes

    - name: Apply system configurations
      block:
        - name: Ensure zignage user is in video group
          user:
            name: zignage
            groups: video
            append: yes

        - name: Reload udev rules
          shell: |
            udevadm control --reload-rules
            udevadm trigger

        - name: Reset perms
          shell: |
            sudo chown -R zignage:zignage /etc/camera_binding
            sudo chmod 755 /etc/camera_binding
            sudo chmod 644 /etc/camera_binding/*.txt
            sudo chmod 644 /etc/camera_binding/camera_config.json
            sudo systemctl restart vidireports

        - name: Wait for udev
          pause:
            seconds: 2

        - name: Verify video devices
          shell: ls -l /dev/video*
          register: video_devices
          ignore_errors: yes

        - name: Display video devices
          debug:
            var: video_devices.stdout_lines

        - name: Reload systemd
          systemd:
            daemon_reload: yes

        - name: Restart camera_binder
          systemd:
            name: camera_binder
            state: restarted

        - name: Wait for service
          pause:
            seconds: 5

        - name: Check service status
          shell: "systemctl status camera_binder.service"
          register: service_status
          ignore_errors: yes

        - name: Display service status
          debug:
            var: service_status.stdout_lines

        - name: Check final device permissions
          shell: |
            echo "Video devices:"
            ls -l /dev/video*
            echo "Camera symlinks:"
            ls -l /dev/camera*
          register: final_check
          ignore_errors: yes

        - name: Display final check
          debug:
            var: final_check.stdout_lines
