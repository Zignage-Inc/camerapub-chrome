          - name: Copy camera_binder.service
      copy:
        src: /home/zignage/camerapub/camera_binder.service
        dest: /etc/systemd/system/camera_binder.service
        remote_src: yes
        force: yes
        mode: '0644'

      

        
    - name: Find video devices
      find:
        paths: /dev
        patterns: 'video*'
        file_type: any
      register: video_devices

    - name: Set permissions for video devices
      file:
        path: "{{ item.path }}"
        mode: '0666'
      with_items: "{{ video_devices.files }}"
      when: video_devices.matched > 0
    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Restart camera_binder service
      become: yes
      become_user: root
      shell: |
        sudo systemctl restart camera_binder
      ignore_errors: yes

    - name: Get service status if restart failed
      shell: "sleep 11 && systemctl status camera_binder.service && journalctl -xeu camera_binder.service"
      when: restart_result is failed
      register: service_status
      ignore_errors: yes

        #    - name: Display service status
        #debug:
        # var: service_status.stdout_lines
        #when: restart_result is failed
    - name: Copy camera-setup.sh
      copy:
        src: /home/zignage/camerapub/camera-setup.sh
        dest: /usr/local/bin/camera-setup.sh
        mode: '0755'

